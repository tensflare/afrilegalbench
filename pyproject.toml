[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "malawi-bench"
version = "0.1.0"
description = "African Legal AI Benchmark — evaluating LLM legal reasoning across African jurisdictions"
requires-python = ">=3.10"
license = { text = "Apache 2.0" }
authors = [
    { name = "Tensflare Ltd" },
]
dependencies = [
    "datasets>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]
scrape = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
